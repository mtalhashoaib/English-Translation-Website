<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>English Word-by-Word Translator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>English → Word by Word</h1>
    <p class="sub">Translation + Roman pronunciation, line by line</p>
  </header>

  <div class="switchbox">
    <label class="big"><input type="checkbox" id="enabled"> Translate on web pages (no copy-paste)</label>
    <div class="row">
      <label for="mode">Mode</label>
      <select id="mode">
        <option value="select">Select text on a page → pop-up</option>
        <option value="page">Whole page, word by word</option>
      </select>
    </div>
  </div>

  <div class="row">
    <label for="lang">Translate to</label>
    <select id="lang">
      <option value="zh-CN">Chinese (中文 · Pinyin)</option>
      <option value="de">German (Deutsch)</option>
      <option value="fr">French (Français)</option>
      <option value="ru">Russian (Русский)</option>
      <option value="ar">Arabic (العربية)</option>
      <option value="fa">Persian (فارسی)</option>
      <option value="ur">Urdu (اردو)</option>
      <option value="ja">Japanese (日本語 · Rōmaji)</option>
      <option value="ko">Korean (한국어 · Romanization)</option>
      <option value="nl">Dutch (Nederlands)</option>
      <option value="sv">Swedish (Svenska)</option>
      <option value="no">Norwegian (Norsk)</option>
      <option value="da">Danish (Dansk)</option>
    </select>
  </div>

  <textarea id="input" rows="6" placeholder="Type or paste English text here. Each line is translated separately."></textarea>

  <div class="row buttons">
    <button id="go" class="primary">Translate</button>
    <button id="grab" title="Use the text selected on the current page">Use selected text</button>
    <button id="clear">Clear</button>
    <label class="check"><input type="checkbox" id="showRoman" checked> Roman</label>
  </div>

  <div id="status" role="status"></div>
  <details id="diagBox">
    <summary>Not working? Run diagnostics</summary>
    <div class="row buttons">
      <button id="diagRun">Run diagnostics</button>
      <button id="diagGrant" title="Ask the browser to grant access to the translate services">Grant access</button>
      <button id="diagCopy">Copy</button>
    </div>
    <pre id="diag"></pre>
  </details>
  <div id="output"></div>

  <footer>Pronunciation for French, German, Dutch, Swedish, Norwegian and Danish is an approximate English-style respelling. Tap 🔊 to hear the real thing.</footer>

  <script src="core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
